<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter - DevTools</title>
    <meta name="description" content="Convert text between camelCase, PascalCase, snake_case, CONSTANT_CASE, kebab-case, Title Case, and more. Free online case converter for developers.">
    <meta name="keywords" content="case converter, camelCase, PascalCase, snake_case, kebab-case, title case, text case converter">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#3b82f6' }
                }
            }
        }
    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VVLR9NKKXE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-VVLR9NKKXE');
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="../index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-gray-500 mr-3 hover:text-gray-700"></i>
                        <i class="fas fa-tools text-primary text-2xl mr-3"></i>
                        <h1 class="text-xl font-bold text-gray-900">DevTools</h1>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="lang-zh" class="px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100 text-sm font-medium" onclick="switchLang('zh')">中文</button>
                    <button id="lang-en" class="px-3 py-1 rounded-md bg-primary text-white text-sm font-medium" onclick="switchLang('en')">EN</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Case Converter</h2>
            <p class="text-gray-600 mt-1">Convert text between camelCase, PascalCase, snake_case, CONSTANT_CASE, kebab-case, Title Case, and more</p>
        </div>

        <!-- Input Section -->
        <div class="bg-white rounded-xl shadow-md border border-gray-100 p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <label class="block text-sm font-medium text-gray-700">Text Input</label>
                <div class="flex space-x-2">
                    <button onclick="clearText()" class="px-3 py-1 text-xs text-gray-500 hover:text-gray-700 border border-gray-200 rounded-md">
                        <i class="fas fa-trash mr-1"></i>Clear
                    </button>
                    <button onclick="loadExample()" class="px-3 py-1 text-xs text-primary hover:text-blue-700 border border-primary rounded-md">
                        <i class="fas fa-lightbulb mr-1"></i>Example
                    </button>
                </div>
            </div>
            <textarea id="input" class="w-full h-40 p-4 border border-gray-200 rounded-lg font-mono text-sm resize-none focus:outline-none focus:border-primary" placeholder="Type or paste your text here..." oninput="update()"></textarea>
            <div class="flex justify-between items-center mt-3 text-sm text-gray-500">
                <span><span id="charCount">0</span> characters</span>
                <span><span id="wordCount">0</span> words</span>
                <span><span id="lineCount">0</span> lines</span>
            </div>
        </div>

        <!-- Output Grid -->
        <div id="outputGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>

    <script>
        function toWords(text) {
            if (!text.trim()) return [];
            return text
                .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
                .replace(/[^a-zA-Z0-9]+/g, ' ')
                .trim()
                .split(/\s+/)
                .filter(Boolean);
        }

        function cap(w) {
            return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
        }

        function sentenceCase(text) {
            return text.replace(/(^\s*|[.!?]\s+)([a-z])/g, function (m, p1, p2) {
                return p1 + p2.toUpperCase();
            });
        }

        const converters = [
            { key: 'lowercase', label: 'lowercase', fn: function (t) { return t.toLowerCase(); } },
            { key: 'uppercase', label: 'UPPERCASE', fn: function (t) { return t.toUpperCase(); } },
            { key: 'sentence', label: 'Sentence case', fn: sentenceCase },
            { key: 'title', label: 'Title Case', fn: function (t) { return toWords(t).map(cap).join(' '); } },
            { key: 'camel', label: 'camelCase', fn: function (t) { return toWords(t).map(function (w, i) { return i === 0 ? w.toLowerCase() : cap(w); }).join(''); } },
            { key: 'pascal', label: 'PascalCase', fn: function (t) { return toWords(t).map(cap).join(''); } },
            { key: 'snake', label: 'snake_case', fn: function (t) { return toWords(t).map(function (w) { return w.toLowerCase(); }).join('_'); } },
            { key: 'constant', label: 'CONSTANT_CASE', fn: function (t) { return toWords(t).map(function (w) { return w.toUpperCase(); }).join('_'); } },
            { key: 'kebab', label: 'kebab-case', fn: function (t) { return toWords(t).map(function (w) { return w.toLowerCase(); }).join('-'); } },
            { key: 'train', label: 'Train-Case', fn: function (t) { return toWords(t).map(cap).join('-'); } }
        ];

        function buildCards() {
            const grid = document.getElementById('outputGrid');
            grid.innerHTML = converters.map(function (c) {
                return '' +
                    '<div class="bg-white rounded-xl shadow-md border border-gray-100 p-5">' +
                        '<div class="flex justify-between items-center mb-2">' +
                            '<h4 class="font-semibold text-gray-900 font-mono text-sm">' + c.label + '</h4>' +
                            '<button onclick="copyText(\'' + c.key + '\')" class="px-2 py-1 text-xs text-primary hover:text-blue-700 border border-primary rounded-md">' +
                                '<i class="fas fa-copy mr-1"></i>Copy' +
                            '</button>' +
                        '</div>' +
                        '<div id="out-' + c.key + '" class="text-sm font-mono text-gray-700 break-all bg-gray-50 rounded p-3 min-h-[3rem] overflow-auto whitespace-pre-wrap"></div>' +
                    '</div>';
            }).join('');
        }

        function update() {
            const text = document.getElementById('input').value;
            const chars = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const lines = text ? text.split('\n').length : 0;
            document.getElementById('charCount').textContent = chars.toLocaleString();
            document.getElementById('wordCount').textContent = words.toLocaleString();
            document.getElementById('lineCount').textContent = lines.toLocaleString();

            converters.forEach(function (c) {
                const out = c.fn(text);
                const el = document.getElementById('out-' + c.key);
                if (el) {
                    el.textContent = out || '—';
                }
            });
        }

        function copyText(key) {
            const el = document.getElementById('out-' + key);
            if (!el) return;
            const text = el.textContent;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () {
                    flashCopied(key);
                }).catch(function () { fallbackCopy(text); });
            } else {
                fallbackCopy(text);
            }
            if (typeof gtag === 'function') {
                gtag('event', 'case_convert_copy', { 'case_type': key });
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
        }

        function flashCopied(key) {
            const btn = document.querySelector('button[onclick="copyText(\'' + key + '\')"]');
            if (!btn) return;
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check mr-1"></i>Copied';
            btn.classList.add('text-green-600', 'border-green-600');
            setTimeout(function () {
                btn.innerHTML = original;
                btn.classList.remove('text-green-600', 'border-green-600');
            }, 1500);
        }

        function clearText() {
            document.getElementById('input').value = '';
            update();
        }

        function loadExample() {
            document.getElementById('input').value = 'Convert this user_input string INTO DifferentCases for my API response handler';
            update();
        }

        function switchLang(lang) {
            document.getElementById('lang-zh').className = lang === 'zh'
                ? 'px-3 py-1 rounded-md bg-primary text-white text-sm font-medium'
                : 'px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100 text-sm font-medium';
            document.getElementById('lang-en').className = lang === 'en'
                ? 'px-3 py-1 rounded-md bg-primary text-white text-sm font-medium'
                : 'px-3 py-1 rounded-md text-gray-600 hover:bg-gray-100 text-sm font-medium';
            localStorage.setItem('devtools-lang', lang);
        }

        // Init
        buildCards();
        const savedLang = localStorage.getItem('devtools-lang') || 'en';
        switchLang(savedLang);
        update();
    </script>
</body>
</html>
